# TEST COMMIT PARA VERIFICAR ACTUALIZACIÓN EN GITLAB - [26/0582025 19:45]
stages:
  - deploy_dev
  # - deploy_prod # Comentado hasta que lo necesites

default:
  # Si realmente no usas Docker-in-Docker (dind) en NINGÚN stage, puedes quitar 'image' y 'services' de 'default'.
  # Si otros stages SÍ lo usan, déjalo, pero 'deploy_dev' lo sobrescribirá.
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind

variables:
  DOCKER_TLS_CERTDIR: "" # Necesario si 'dind' está activo.
  TAG: "$CI_COMMIT_TAG"
  APP_NAME: "planilla-rubik-back"
  WORDIR_BASE: "/home/SOURCE" # Asegúrate que esta es la ruta base correcta en tu VM

deploy_dev:
  stage: deploy_dev
  tags:
    - runner-mindfactory
  image: alpine:3.11 # Sobrescribe default.image para este job
  services: [] # Explícitamente decimos que este job no necesita el servicio 'dind'
  variables:
    TYPE_APP: "backend"
    # WORDIR se resuelve a: /home/SOURCE/backend/planilla-rubik-back
    WORDIR: "$WORDIR_BASE/$TYPE_APP/$APP_NAME"
    GIT_BRANCH_TO_PULL: "$CI_COMMIT_BRANCH" # Usará la rama del commit (ej. 'main')
  before_script:
    - apk update && apk add openssh-client bash curl git # Añadido 'git' explícitamente
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_DEV_PEM" > /tmp/vm-rubik-dev-01.pem
    - chmod 400 /tmp/vm-rubik-dev-01.pem
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $VM_IPADDRESS_DEV >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Paso 1: Detener el proceso PM2 existente (si existe)
    - 'echo "Paso 1: Deteniendo la aplicación PM2 $APP_NAME..."'
    - ssh -i /tmp/vm-rubik-dev-01.pem $SSH_USER@$VM_IPADDRESS_DEV "pm2 delete $APP_NAME || true"

    # Paso 2: Actualizar el código desde Git en el servidor
    - 'echo "Paso 2: Actualizando el código fuente en $WORDIR desde la rama $GIT_BRANCH_TO_PULL..."'
    - |
      ssh -i /tmp/vm-rubik-dev-01.pem $SSH_USER@$VM_IPADDRESS_DEV <<EOF
        echo "--- Conectado a la VM para actualizar código en $WORDIR ---"
        cd "$WORDIR"
        
        echo "Verificando el estado actual de Git..."
        git status
        
        echo "Descartando cualquier cambio local no comiteado en archivos rastreados..."
        git reset --hard HEAD 
        
        echo "Limpiando archivos y directorios no rastreados (respeta .gitignore)..."
        # Usa -fd para limpiar archivos no rastreados que NO están en .gitignore.
        # ¡NO USES -x (git clean -fdx) a menos que estés SEGURO de querer borrar archivos ignorados como .env!
        git clean -fd 
        
        echo "Haciendo pull de los últimos cambios de origin/$GIT_BRANCH_TO_PULL..."
        # Asegúrate que la clave SSH en /home/ubuntu/.ssh/gitlab-mf tiene permisos para este repo
        # y que el agente SSH está configurado en el servidor si es necesario para git pull.
        # El 'eval ssh-agent' y 'ssh-add' aquí es para que el 'git pull' use la clave correcta.
        eval \$(ssh-agent -s) # Escapar el $ para que se evalúe en el servidor
        ssh-add /home/ubuntu/.ssh/gitlab-mf # Asumiendo que esta clave está en el servidor y es para GitLab
        git pull origin $GIT_BRANCH_TO_PULL # $GIT_BRANCH_TO_PULL se expande por GitLab aquí
        
        echo "Estado de Git después del pull:"
        git status -s # -s para un status breve
        echo "Último commit traído:"
        git log -1 --pretty=oneline
        echo "--- Actualización de código completada ---"
      EOF

    # Paso 3: Instalar/Reinstalar dependencias DESPUÉS de actualizar el código
    - 'echo "Paso 3: Instalando dependencias npm en $WORDIR..."'
    - ssh -i /tmp/vm-rubik-dev-01.pem $SSH_USER@$VM_IPADDRESS_DEV "cd $WORDIR && npm install --force"

    # Paso 4: Iniciar/Reiniciar el nuevo proceso con PM2
    - 'echo "Paso 4: Iniciando la aplicación $APP_NAME con PM2..."'
    - ssh -i /tmp/vm-rubik-dev-01.pem $SSH_USER@$VM_IPADDRESS_DEV "cd $WORDIR && pm2 start 'npm start' --name $APP_NAME"
    - 'echo "Despliegue finalizado. Verificando estado de PM2..."'
    - ssh -i /tmp/vm-rubik-dev-01.pem $SSH_USER@$VM_IPADDRESS_DEV "pm2 list"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' # Se ejecutará en merges/pushes a main
      when: on_success # Ejecutar solo si los jobs anteriores (si los hubiera en el stage) tienen éxito